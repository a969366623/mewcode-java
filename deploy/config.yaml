# Public-deployment-safe application configuration.
# Do not put api_key here. Set OPENAI_API_KEY in Render's environment variables.
providers:
  - name: openai
    protocol: openai
    base_url: https://api.openai.com/v1
    model: gpt-4.1-mini

# Keep this demo conservative: tools request confirmation from the web UI.
permission_mode: default
enable_coordinator_mode: false
enable_fork: false
