# Public-deployment-safe application configuration.
# Do not put api_key here. Set the DeepSeek key as OPENAI_API_KEY in Render.
providers:
  - name: deepseek
    protocol: openai-compat
    base_url: https://api.deepseek.com
    model: deepseek-v4-flash
    context_window: 1000000
    max_output_tokens: 1500

# Keep this demo conservative: tools request confirmation from the web UI.
permission_mode: default
enable_coordinator_mode: false
enable_fork: false
