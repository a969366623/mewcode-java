services:
  - type: web
    name: mewcode-remote
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: REMOTE_UI_REQUIRE_AUTH
        value: "true"
      - key: REMOTE_UI_USERNAME
        sync: false
      - key: REMOTE_UI_PASSWORD
        sync: false
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_DAILY_TOKEN_BUDGET
        value: "100000"
      - key: DEMO_GLOBAL_DAILY_REQUESTS
        value: "20"
      - key: DEMO_IP_HOURLY_REQUESTS
        value: "5"
      - key: DEMO_MAX_INPUT_CHARS
        value: "2000"
      - key: DEMO_MAX_OUTPUT_TOKENS
        value: "1500"
      - key: DEMO_MAX_LLM_CALLS_PER_REQUEST
        value: "3"
